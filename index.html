<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c0a09" />
    <meta name="color-scheme" content="dark" />
    <title>Floor Two — player handbook</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="shell">
      <header class="hero">
        <div class="hero-inner">
          <p class="hero-eyebrow">Dungeon Crawler Carl · Floor Two</p>
          <h1 class="hero-title">Player handbook</h1>
          <p class="hero-lede">
            Lore, gear, and hints from the crawl — refreshed between sessions.
          </p>
          <label class="search-wrap">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input
              id="search"
              type="search"
              placeholder="Search this handbook…"
              autocomplete="off"
              aria-label="Search handbook"
            />
          </label>
        </div>
      </header>
      <div class="nav-bar">
        <nav id="nav" class="nav" aria-label="Sections"></nav>
      </div>
      <main id="main" class="main">
        <p class="loading">Loading handbook…</p>
      </main>
      <footer class="footer">
        <p id="footer-note">
          Snapshot from the table app. Live play still happens at session night.
        </p>
        <p id="export-meta" class="meta"></p>
      </footer>
    </div>
    <script src="app.js" type="module"></script>
  </body>
</html>
