<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090807" />
    <meta name="color-scheme" content="dark" />
    <title>Floor Two — player handbook</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="shell">
      <header class="hero">
        <div class="hero-inner">
          <p class="hero-eyebrow">Floor Two</p>
          <h1 class="hero-title">Handbook</h1>
          <div class="hero-rule" aria-hidden="true"></div>
          <label class="search-wrap">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input
              id="search"
              type="search"
              placeholder="Search…"
              autocomplete="off"
              aria-label="Search handbook"
            />
          </label>
        </div>
      </header>
      <div class="nav-bar">
        <div id="nav" class="nav-groups" role="navigation" aria-label="Handbook sections"></div>
      </div>
      <main id="main" class="main">
        <p class="loading">Loading…</p>
      </main>
      <footer class="footer">
        <p id="footer-note">Snapshot from the table app.</p>
        <p id="export-meta" class="meta"></p>
      </footer>
    </div>
    <script src="app.js" type="module"></script>
  </body>
</html>
